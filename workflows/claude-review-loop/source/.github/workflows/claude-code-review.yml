name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-claude-loop') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --model claude-opus-4-7
            --allowedTools "Bash(gh pr *),Bash(gh api *),Read,Glob,Grep"
          prompt: |
            You are an automated PR reviewer. Review PR #${{ github.event.pull_request.number }}
            of ${{ github.repository }}. Be efficient — finish within ~15 tool turns.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` and skim changed files only.
            2. Read `.github/PR-REVIEW-RUBRIC.md` once for severity rules.
            3. Post inline comments only for real issues (max ~8). Tag `[Category/Severity]`.
            4. Submit exactly ONE PR review (REQUEST_CHANGES if any Critical, else COMMENT)
               whose body MUST end with the summary block below.
               Do NOT submit separate reviews per inline comment — one review only.
            5. Do not explore unrelated files.

            REQUIRED — your review body MUST end with this exact block, no other markup:

            <!-- claude-review:summary -->
            Confidence: N/5
            Critical: N
            Suggestions: N
            Unresolved: N
            <!-- /claude-review:summary -->

            Counting rules:
            - Confidence: your overall confidence the PR is mergeable, on a 1–5 scale per the rubric.
            - Critical: number of issues flagged as Critical severity.
            - Suggestions: number of issues flagged as Suggestion severity (style, minor).
            - Unresolved: number of unresolved inline review threads on this PR after your review.
              For a fresh review this equals Critical + Suggestions; for re-reviews on a later push,
              count only threads that are still open.

            Be strict. The downstream loop uses this block to decide whether to keep iterating.
            Do NOT include any other text after the closing marker.
